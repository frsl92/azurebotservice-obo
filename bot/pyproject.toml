[project]
name = "obo-bot"
version = "0.1.0"
description = "Teams bot hosting a LangGraph agent; uses Azure Bot Service OBO to call the MCP server as the Teams user"
requires-python = ">=3.12"
dependencies = [
    "microsoft-agents-hosting-aiohttp",
    "microsoft-agents-hosting-teams",
    "microsoft-agents-authentication-msal",
    "langgraph",
    "langchain-openai",
    "langchain-mcp-adapters",
    "mcp",
    "httpx",
    "azure-identity",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]
