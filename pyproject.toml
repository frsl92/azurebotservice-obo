[project]
name = "teams-obo-demo"
version = "0.1.0"
description = "Teams bot + LangGraph agent demonstrating Bot Service OBO authentication to an MCP server"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.workspace]
members = ["bot", "mcp_server"]

[[tool.uv.index]]
name = "msiopypi"
url = "https://pkgs.dev.azure.com/ms-feed-12/1es-public/_packaging/pypi-public/pypi/simple/"
default = true
