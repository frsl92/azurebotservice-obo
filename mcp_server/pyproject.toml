[project]
name = "obo-mcp-server"
version = "0.1.0"
description = "MCP server that validates the caller's Entra JWT and reveals who is calling"
requires-python = ">=3.12"
dependencies = [
    "mcp",
    "PyJWT[crypto]",
    "uvicorn",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]
